<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Black+Ops+One&family=Cedarville+Cursive&family=Edu+QLD+Hand:wght@400..700&family=Isometra&family=Smooch+Sans:wght@100..900&display=swap"
        rel="stylesheet">

    <title>Jabbee</title>
</head>

<body>
    <header>

        <nav class="navbar navbar-expand-lg ">
            <div class="container-fluid">
                <a class="navbar-brand d-inline-flex align-items-center gap-2" href="#">
                    <img src="src/cryjabe.png" alt="" height="32" />
                    <span>JABBEE</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Menu</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Promos</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

    </header>

    <main>

        <div class="caro">
            <div id="carouselExample" class="carousel slide">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="src/carousel-images/cheesyyun.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="src/carousel-images/chicken ni shinobu.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="src/carousel-images/porpolbig.png" class="d-block w-100" alt="...">
                    </div>
                    <div class="carousel-item">
                        <img src="src/carousel-images/figures.png" class="d-block w-100" alt="...">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </div>

        <section class="action-container">


            <div class="action-card">
                <div class="icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 18h9c2 0 3-1 3-3V7h-7v7H5c-1.7 0-3 1.3-3 3s1.3 3 3 3h12" />
                        <circle cx="6" cy="20" r="1.5" />
                        <circle cx="17" cy="20" r="1.5" />
                    </svg>
                </div>

                <a href="#">
                    Order Now
                    <span>›</span>
                </a>
            </div>



            <div class="action-card">
                <div class="icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" />
                        <circle cx="12" cy="9" r="2" />
                    </svg>
                </div>

                <a href="#">
                    Find a Store
                    <span>›</span>
                </a>
            </div>



            <div class="action-card">
                <div class="icon">
                    <svg viewBox="0 0 24 24">
                        <rect x="4" y="3" width="16" height="18" rx="1" />
                        <line x1="8" y1="3" x2="8" y2="21" />
                        <line x1="4" y1="8" x2="8" y2="8" />
                        <line x1="4" y1="13" x2="8" y2="13" />
                        <line x1="4" y1="18" x2="8" y2="18" />
                        <line x1="12" y1="8" x2="12" y2="14" />
                        <line x1="15" y1="8" x2="15" y2="14" />
                        <line x1="18" y1="8" x2="18" y2="14" />
                    </svg>
                </div>

                <a href="#">
                    See Menu
                    <span>›</span>
                </a>
            </div>



            <div class="action-card">
                <div class="icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M5 19l7-14 7 7-14 7z" />
                        <line x1="14" y1="4" x2="18" y2="2" />
                        <line x1="18" y1="7" x2="22" y2="6" />
                        <line x1="17" y1="3" x2="20" y2="1" />
                    </svg>
                </div>

                <a href="#">
                    Book a Party
                    <span>›</span>
                </a>
            </div>

        </section>

        </div>



    </main>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
</body>

</html>
